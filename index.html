// ============================================================
// APP SHELL
// ============================================================
function tabsForRole(role) {
  if (role === 'Manager') return ['Utama', 'Permohonan', 'Tugasan HQ', 'Equipment', 'Jadual', 'Update Mingguan', 'Tetapan', 'Panduan'];
  if (role === 'HQ') return ['Utama', 'Tugasan HQ', 'Equipment', 'Panduan'];
  return ['Utama', 'Update Mingguan', 'Permohonan', 'Equipment', 'Jadual', 'Panduan'];
}

function App() {
  const [user, setUser] = useState(() => {
    const raw = localStorage.getItem('pt_user');
    return raw ? JSON.parse(raw) : null;
  });
  const [lists, setLists] = useState(null);
  const [tab, setTab] = useState('Utama');
  const [weekStart, setWeekStart] = useState(mondayOf(toISO(new Date())));
  const [menuOpen, setMenuOpen] = useState(false);

  const loadLists = useCallback(async () => {
    const res = await api('getLists');
    if (res.ok) setLists(res);
  }, []);
  useEffect(() => { if (user) loadLists(); }, [user, loadLists]);

  const logout = () => {
    localStorage.removeItem('pt_token'); localStorage.removeItem('pt_user');
    setUser(null); setLists(null); setTab('Utama');
  };

  if (API_BASE_URL.indexOf('PASTE_YOUR') !== -1) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6">
        <Card className="max-w-md">
          <h2 className="font-extrabold text-[#e5342b] mb-2">Setup belum lengkap</h2>
          <p className="text-sm text-slate-600">Tukar <code className="bg-slate-100 px-1 rounded">API_BASE_URL</code> dalam index.html kepada Google Apps Script Web App URL kau (berakhir dengan <code className="bg-slate-100 px-1 rounded">/exec</code>). Rujuk SETUP_PANDUAN.md.</p>
        </Card>
      </div>
    );
  }

  if (!user) return <LoginScreen onLogin={setUser} />;
  if (!lists) return <div className="min-h-screen flex items-center justify-center"><Spinner /></div>;

  const tabs = tabsForRole(user.role);
  const isPlant = user.role === 'Supervisor';

  const renderTab = () => {
    switch (tab) {
      case 'Utama':
        if (user.role === 'HQ') return <HqDashboard user={user} lists={lists} goTo={setTab} />;
        if (isPlant) return <PlantDashboard user={user} lists={lists} weekStart={weekStart} setWeekStart={setWeekStart} goTo={setTab} />;
        return <ManagerDashboard user={user} lists={lists} weekStart={weekStart} setWeekStart={setWeekStart} goTo={setTab} />;
      case 'Update Mingguan': return <WeeklyUpdateView user={user} lists={lists} weekStart={weekStart} setWeekStart={setWeekStart} />;
      case 'Attention':
      case 'Permohonan': return <AttentionView user={user} lists={lists} goTo={setTab} />;
      case 'Tugasan HQ': return <HqTasksView user={user} lists={lists} />;
      case 'Equipment': return <EquipmentView user={user} lists={lists} />;
      case 'Jadual': return <ScheduleView user={user} lists={lists} />;
      case 'Tetapan': return <SettingsView lists={lists} refreshLists={loadLists} />;
      case 'Panduan': return <GuideView />;
      default: return null;
    }
  };

  return (
    <div className="min-h-screen pb-10">
      {/* TOP BAR */}
      <div className="sticky top-0 z-40 px-3 pt-3 bg-[#e9f0fb]/90 backdrop-blur">
        <div className="max-w-[1320px] mx-auto bg-white rounded-[20px] border border-slate-200/70 shadow-[0_1px_3px_rgba(15,23,42,0.05)] px-3 sm:px-4 py-2.5">
          <div className="flex items-center justify-between gap-3">
            <div className="flex items-center gap-2.5 shrink-0">
              <div className="w-9 h-9 rounded-full bg-[#e5342b] text-white flex items-center justify-center font-extrabold text-lg shadow-sm">+</div>
              <span className="font-extrabold text-[14px] sm:text-[15px] text-slate-800 xl:block">PlantOps</span>
            </div>

            <div className="hidden lg:flex flex-1 min-w-0 mx-3 justify-center">
              <div className="flex bg-slate-100 rounded-full p-1 gap-0.5 overflow-x-auto no-bar max-w-full">
              {tabs.map(t => (
                <button key={t} onClick={() => setTab(t)}
                  className={`px-3 py-1.5 rounded-full text-[12px] font-bold whitespace-nowrap transition ${tab === t ? 'bg-[#0b2a66] text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>
                  {t}
                </button>
              ))}
              </div>
            </div>

            <div className="flex items-center gap-2 shrink-0">
              <div className="hidden sm:flex flex-col items-end bg-slate-50 border border-slate-200 rounded-full px-3 py-1">
                <span className="text-[9px] font-bold uppercase tracking-wider text-slate-400 leading-none">Peranan</span>
                <span className="text-[12.5px] font-bold text-slate-700 leading-tight">{user.role}</span>
              </div>
              <button onClick={() => setMenuOpen(!menuOpen)} className="w-9 h-9 rounded-full bg-[#1d4ed8] text-white text-[12px] font-extrabold flex items-center justify-center">
                {initials(user.name)}
              </button>
            </div>
          </div>

          {/* mobile tabs */}
          <div className="lg:hidden flex gap-1.5 mt-2.5 overflow-x-auto no-bar pb-0.5">
            {tabs.map(t => (
              <button key={t} onClick={() => setTab(t)}
                className={`px-3 py-1.5 rounded-full text-[12px] font-bold whitespace-nowrap transition ${tab === t ? 'bg-[#0b2a66] text-white' : 'bg-slate-100 text-slate-600'}`}>
                {t}
              </button>
            ))}
          </div>
        </div>

        {menuOpen && (
          <div className="max-w-[1320px] mx-auto flex justify-end">
            <div className="bg-white rounded-2xl border border-slate-200 shadow-lg mt-2 p-3 w-56">
              <div className="px-2 pb-2 mb-2 border-b border-slate-100">
                <div className="font-bold text-[13.5px] text-slate-800">{user.name}</div>
                <div className="text-[11.5px] text-slate-400">{user.role} · {user.plant}</div>
              </div>
              <button onClick={logout} className="w-full text-left px-2 py-2 rounded-xl text-[13px] font-semibold text-rose-600 hover:bg-rose-50">Log keluar</button>
            </div>
          </div>
        )}
      </div>

      <div className="max-w-[1320px] mx-auto px-3 pt-4">
        {renderTab()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
