<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PlantOps Tracker</title>
<meta name="description" content="Sistem pengurusan mingguan plant: permohonan plant, tugasan HQ, mobilisasi equipment dan manpower." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b2a66" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --navy: #0b2a66;
    --navy-2: #143c8f;
    --blue: #1d4ed8;
    --red: #e5342b;
    --ink: #0f172a;
    --muted: #64748b;
  }
  * { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body { background: #e9f0fb; -webkit-tap-highlight-color: transparent; color: var(--ink); }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #c7d5ea; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .no-bar::-webkit-scrollbar { display: none; }
  .hero { background: linear-gradient(135deg, #0b2a66 0%, #143c8f 60%, #174aa8 100%); }
  input, select, textarea { font-size: 16px; }
  @media (min-width: 640px) { input, select, textarea { font-size: 14px; } }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;

// ============================================================
// !!! WAJIB TUKAR: paste Google Apps Script Web App URL kau di sini
// ============================================================
const API_BASE_URL = "https://script.google.com/macros/s/AKfycbx2Va96vD6NIm48pqqj4vmJ8nIm90BjKHzeOBZmjgzaJs3_JtVX4kNusr7G1ep2j04v/exec";

const DAY_KEYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAY_LABELS = { Mon: 'Isnin', Tue: 'Selasa', Wed: 'Rabu', Thu: 'Khamis', Fri: 'Jumaat', Sat: 'Sabtu', Sun: 'Ahad' };
const DAY_SHORT = { Mon: 'ISN', Tue: 'SEL', Wed: 'RAB', Thu: 'KHA', Fri: 'JUM', Sat: 'SAB', Sun: 'AHD' };

// ------------------------------------------------------------
// API
// ------------------------------------------------------------
async function api(action, payload = {}) {
  const token = localStorage.getItem('pt_token') || '';
  try {
    const res = await fetch(API_BASE_URL, { method: 'POST', body: JSON.stringify({ action, token, payload }) });
    const data = await res.json();
    if (!data.ok && /Sesi tamat/i.test(data.error || '')) {
      localStorage.removeItem('pt_token'); localStorage.removeItem('pt_user');
      window.location.reload();
    }
    return data;
  } catch (err) {
    return { ok: false, error: 'Tak dapat sambung ke server. Semak internet / API URL.' };
  }
}

// ------------------------------------------------------------
// Utils
// ------------------------------------------------------------
function toISO(d) {
  const dt = new Date(d);
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}
function mondayOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return toISO(d);
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return toISO(d);
}
function fmtDate(v) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtDateShort(v) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
function greeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Selamat pagi';
  if (h < 19) return 'Selamat petang';
  return 'Selamat malam';
}
function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function priorityTone(p) {
  const s = String(p || '').toLowerCase();
  if (s === 'critical') return { text: 'text-rose-600', bg: 'bg-rose-50', dot: '#e11d48', label: 'Kritikal' };
  if (s === 'high') return { text: 'text-amber-700', bg: 'bg-amber-50', dot: '#b45309', label: 'Tinggi' };
  if (s === 'medium') return { text: 'text-blue-700', bg: 'bg-blue-50', dot: '#1d4ed8', label: 'Sederhana' };
  return { text: 'text-slate-600', bg: 'bg-slate-100', dot: '#64748b', label: p || 'Rendah' };
}
function statusTone(s) {
  const v = String(s || '').toLowerCase();
  if (v === 'completed' || v === 'closed' || v === 'returned') return 'text-emerald-600';
  if (v.includes('blocked') || v.includes('rejected')) return 'text-rose-600';
  if (v.includes('waiting')) return 'text-amber-700';
  return 'text-blue-700';
}

// ------------------------------------------------------------
// UI atoms
// ------------------------------------------------------------
function Card({ children, className = '', pad = 'p-5' }) {
  return <div className={`bg-white rounded-[22px] border border-slate-200/70 shadow-[0_1px_2px_rgba(15,23,42,0.04)] ${pad} ${className}`}>{children}</div>;
}
function Btn({ children, onClick, tone = 'blue', size = 'md', className = '', disabled, type = 'button' }) {
  const tones = {
    blue: 'bg-[#1d4ed8] text-white hover:bg-[#1a45bd]',
    navy: 'bg-[#0b2a66] text-white hover:bg-[#0a2456]',
    red: 'bg-[#e5342b] text-white hover:bg-[#cc2c24]',
    white: 'bg-white text-[#0b2a66] hover:bg-slate-50 border border-white/60',
    ghost: 'bg-slate-100 text-slate-700 hover:bg-slate-200',
    outline: 'bg-white text-[#1d4ed8] border border-[#1d4ed8]/30 hover:bg-blue-50',
  };
  const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-5 py-2.5 text-sm' };
  return (
    <button type={type} disabled={disabled} onClick={onClick}
      className={`rounded-full font-bold transition disabled:opacity-50 whitespace-nowrap ${tones[tone]} ${sizes[size]} ${className}`}>
      {children}
    </button>
  );
}
function Pill({ children, className = '' }) {
  return <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold ${className}`}>{children}</span>;
}
function SectionTitle({ children, action }) {
  return (
    <div className="flex items-center justify-between mb-4">
      <h3 className="font-extrabold text-[15px] text-slate-800">{children}</h3>
      {action}
    </div>
  );
}
const inputCls = "w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-[#1d4ed8] focus:bg-white transition";
function Field({ label, children, hint }) {
  return (
    <label className="block mb-3">
      <span className="block text-[11px] font-bold uppercase tracking-wide text-slate-400 mb-1.5">{label}</span>
      {children}
      {hint && <span className="block text-[11px] text-slate-400 mt-1">{hint}</span>}
    </label>
  );
}
function Modal({ title, subtitle, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-50 flex items-end sm:items-center justify-center sm:p-4" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}
        className={`bg-white rounded-t-[26px] sm:rounded-[26px] w-full ${wide ? 'sm:max-w-2xl' : 'sm:max-w-md'} max-h-[92vh] overflow-y-auto p-5 shadow-2xl`}>
        <div className="flex items-start justify-between mb-4">
          <div>
            <h3 className="font-extrabold text-lg text-slate-900">{title}</h3>
            {subtitle && <p className="text-xs text-slate-500 mt-0.5">{subtitle}</p>}
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-xl leading-none px-2">✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Spinner({ small }) {
  return <div className={`flex justify-center ${small ? 'py-4' : 'py-12'}`}>
    <div className={`${small ? 'w-5 h-5 border-2' : 'w-8 h-8 border-[3px]'} border-blue-100 border-t-[#1d4ed8] rounded-full animate-spin`}></div>
  </div>;
}
function Empty({ text }) {
  return <div className="text-center text-slate-400 text-sm py-10">{text}</div>;
}
function Ring({ value, total, color = '#e5342b', caption }) {
  const r = 46, circ = 2 * Math.PI * r;
  const pct = total > 0 ? Math.min(1, value / total) : (value > 0 ? 1 : 0);
  return (
    <div className="relative w-[132px] h-[132px] mx-auto">
      <svg viewBox="0 0 120 120" className="w-full h-full -rotate-90">
        <circle cx="60" cy="60" r={r} fill="none" stroke="#eef2f9" strokeWidth="11" />
        <circle cx="60" cy="60" r={r} fill="none" stroke={color} strokeWidth="11" strokeLinecap="round"
          strokeDasharray={`${circ * pct} ${circ}`} />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center">
        <span className="text-[34px] font-extrabold text-slate-800 leading-none">{String(value).padStart(2, '0')}</span>
      </div>
      {caption && (
        <div className="absolute -bottom-2 left-1/2 -translate-x-1/2">
          <span className="bg-[#e5342b] text-white text-[11px] font-bold px-3 py-1 rounded-full whitespace-nowrap shadow">{caption}</span>
        </div>
      )}
    </div>
  );
}
function BarRow({ label, value, max, color }) {
  const pct = max > 0 ? Math.round((value / max) * 100) : 0;
  return (
    <div className="flex items-center gap-3 py-1.5">
      <div className="w-28 shrink-0 text-[13px] text-slate-700 truncate">{label}</div>
      <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
        <div className="h-full rounded-full" style={{ width: Math.max(pct, 3) + '%', background: color }}></div>
      </div>
      <div className="w-10 text-right text-[13px] font-bold" style={{ color }}>{value}</div>
    </div>
  );
}
function ActionRow({ title, meta, metaTone = 'text-rose-600', accent = '#e5342b', button, onButton }) {
  return (
    <div className="flex items-center gap-3 py-3 pl-3 border-l-[3px] rounded-r-lg" style={{ borderColor: accent }}>
      <div className="min-w-0 flex-1">
        <div className="text-[13.5px] font-semibold text-slate-800 truncate">{title}</div>
        <div className="text-[11.5px] text-slate-400 mt-0.5">
          <span className={`font-bold ${metaTone}`}>{meta.split('·')[0]}</span>
          {meta.includes('·') && <span> · {meta.split('·').slice(1).join('·').trim()}</span>}
        </div>
      </div>
      {button && <Btn size="sm" onClick={onButton}>{button}</Btn>}
    </div>
  );
}
function MiniStat({ icon, value, label, tone = 'text-slate-800' }) {
  return (
    <div className="flex-1 text-center px-1">
      <div className="text-[18px] mb-0.5">{icon}</div>
      <div className={`text-[19px] font-extrabold leading-none ${tone}`}>{value}</div>
      <div className="text-[10.5px] text-slate-400 mt-1 leading-tight">{label}</div>
    </div>
  );
}
function WeekPicker({ value, onChange }) {
  return (
    <div className="flex items-center gap-2">
      <button onClick={() => onChange(addDays(value, -7))} className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">‹</button>
      <input type="date" value={value} onChange={(e) => onChange(mondayOf(e.target.value))}
        className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-[#1d4ed8]" />
      <button onClick={() => onChange(addDays(value, 7))} className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold">›</button>
    </div>
  );
}

// ============================================================
// LOGIN
// ============================================================
function LoginScreen({ onLogin }) {
  const [name, setName] = useState('');
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setErr(''); setLoading(true);
    const res = await api('login', { name, pin });
    setLoading(false);
    if (res.ok) {
      localStorage.setItem('pt_token', res.token);
      localStorage.setItem('pt_user', JSON.stringify(res.user));
      onLogin(res.user);
    } else setErr(res.error || 'Login gagal.');
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4 hero">
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="w-14 h-14 rounded-2xl bg-[#e5342b] mx-auto mb-3 flex items-center justify-center text-white text-2xl font-extrabold shadow-lg">P</div>
          <h1 className="text-xl font-extrabold text-white">PlantOps Tracker</h1>
          <p className="text-blue-200 text-sm mt-1">Pengurusan mingguan plant &amp; sokongan HQ</p>
        </div>
        <Card className="!rounded-[26px]">
          <form onSubmit={submit}>
            <Field label="Nama">
              <input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="cth: Iqbal" autoFocus />
            </Field>
            <Field label="PIN">
              <input className={inputCls} type="password" inputMode="numeric" value={pin} onChange={(e) => setPin(e.target.value)} placeholder="••••" />
            </Field>
            {err && <div className="text-rose-600 text-sm mb-3 bg-rose-50 rounded-xl px-3 py-2">{err}</div>}
            <Btn type="submit" tone="navy" size="lg" className="w-full" disabled={loading}>{loading ? 'Sila tunggu…' : 'Log Masuk'}</Btn>
          </form>
        </Card>
        <p className="text-center text-blue-200/80 text-xs mt-4">Login pertama: Admin / 1234</p>
      </div>
    </div>
  );
}

// ============================================================
// DASHBOARD — MANAGER
// ============================================================
function ManagerDashboard({ user, lists, weekStart, setWeekStart, goTo }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [assignRow, setAssignRow] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    const res = await api('getDashboard', { weekStart, plantFilter: 'ALL' });
    if (res.ok) setData(res);
    setLoading(false);
  }, [weekStart]);
  useEffect(() => { load(); }, [load]);

  if (loading || !data) return <Spinner />;

  const t = data.totals;
  const compliance = t.plants > 0 ? Math.round((t.updatesSubmitted / t.plants) * 100) : 0;
  const needAttention = [...data.summary].sort((a, b) => b.attentionItems - a.attentionItems).slice(0, 5);
  const critical = data.summary.filter(s => s.oldestPending > 14).length;

  return (
    <div className="grid lg:grid-cols-[330px_minmax(0,1fr)] gap-4 items-start">
      {/* LEFT SUMMARY */}
      <Card className="lg:sticky lg:top-24">
        <SectionTitle action={<Btn size="sm" tone="ghost" onClick={load}>Refresh</Btn>}>Ringkasan saya</SectionTitle>
        <Ring value={t.totalAttentionItems} total={Math.max(t.totalAttentionItems, 10)} caption="Perlu tindakan" />
        <p className="text-center text-[15px] font-bold text-slate-800 mt-6">{greeting()}, {user.name}</p>

        <div className="mt-5">
          <div className="flex items-end gap-2">
            <span className="text-[34px] font-extrabold leading-none text-slate-800">{compliance}%</span>
            <span className="text-xs text-slate-500 mb-1">Pematuhan update mingguan</span>
          </div>
          <div className="grid grid-cols-3 gap-2 mt-4">
            {[
              { c: '#059669', v: t.updatesSubmitted, l: 'Dihantar' },
              { c: '#1d4ed8', v: t.updatesMissing, l: 'Belum hantar' },
              { c: '#e5342b', v: t.leaveGaps || 0, l: 'Cuti tiada ganti' },
            ].map((s) => (
              <div key={s.l}>
                <div className="h-1.5 rounded-full mb-2" style={{ background: s.c }}></div>
                <div className="text-[17px] font-extrabold text-slate-800 leading-none">{s.v}</div>
                <div className="text-[10.5px] text-slate-400 mt-1">{s.l}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="mt-5 border border-slate-200 rounded-2xl p-3 flex">
          <MiniStat icon="🏭" value={t.plants} label="Plant dipantau" />
          <MiniStat icon="🧰" value={t.totalHqPending} label="Tugasan HQ terbuka" />
          <MiniStat icon="⏱" value={t.oldestPendingOverall} label="Pending terlama (hari)" tone="text-rose-600" />
        </div>
      </Card>

      {/* MAIN */}
      <div className="space-y-4">
        <div className="hero rounded-[22px] p-5 text-white">
          <div className="flex items-start justify-between gap-3 mb-4">
            <div>
              <h2 className="text-lg font-extrabold">Plant perlu perhatian</h2>
              <p className="text-blue-200 text-xs mt-0.5">{t.totalAttentionItems} permohonan terbuka daripada {t.plants} plant</p>
            </div>
            <Btn tone="white" size="sm" onClick={() => goTo('Permohonan')}>Lihat semua</Btn>
          </div>
          <div className="grid sm:grid-cols-3 gap-3">
            {needAttention.slice(0, 3).map((s) => (
              <div key={s.plant} className="bg-white/10 rounded-2xl p-3.5">
                <div className="text-[26px] font-extrabold leading-none">{s.attentionItems}</div>
                <div className="text-[12px] text-blue-100 mt-1.5 font-semibold truncate">{s.plant}</div>
                <div className="text-[11px] text-blue-200/80 mt-0.5">pending terlama {s.oldestPending} hari</div>
              </div>
            ))}
          </div>
          <div className="text-[11px] text-blue-200/80 mt-3">
            {t.updatesMissing} plant belum hantar update minggu ini · {t.equipmentPending} permohonan equipment aktif
          </div>
        </div>

        <div className="grid lg:grid-cols-2 gap-4">
          <Card>
            <SectionTitle action={<Btn size="sm" tone="ghost" onClick={() => goTo('Jadual')}>Jadual</Btn>}>Plant memerlukan perhatian</SectionTitle>
            {needAttention.map((s) => (
              <BarRow key={s.plant} label={s.plant} value={s.attentionItems}
                max={Math.max(...data.summary.map(x => x.attentionItems), 1)}
                color={s.oldestPending > 14 ? '#e5342b' : s.attentionItems > 2 ? '#b45309' : '#1d4ed8'} />
            ))}
          </Card>

          <Card>
            <SectionTitle action={<Btn size="sm" tone="ghost" onClick={() => goTo('Permohonan')}>Lihat semua</Btn>}>Perlu tindakan</SectionTitle>
            {data.actionItems.length === 0 ? <Empty text="Tiada item tertunggak." /> : (
              <div className="space-y-1">
                {data.actionItems.slice(0, 4).map((a) => (
                  <ActionRow key={a.id}
                    title={`${a.plant} · ${a.item}`}
                    meta={`${a.unassigned ? 'Belum assign' : (a.hq || 'HQ')} · ${a.pendingDays} hari · ${a.status}`}
                    metaTone={a.unassigned ? 'text-rose-600' : 'text-amber-700'}
                    accent={a.unassigned ? '#e5342b' : '#b45309'}
                    button={a.unassigned ? 'Assign' : 'Buka'}
                    onButton={() => setAssignRow(a)} />
                ))}
              </div>
            )}
          </Card>
        </div>

        <Card>
          <SectionTitle action={<Btn size="sm" tone="ghost" onClick={() => goTo('Jadual')}>Buka jadual</Btn>}>Headcount harian ikut plant (minggu ni)</SectionTitle>
          <div className="overflow-x-auto no-bar -mx-1 px-1">
            <table className="w-full text-sm min-w-[620px]">
              <thead>
                <tr className="text-[11px] uppercase tracking-wide text-slate-400">
                  <th className="text-left font-bold pb-2 pl-1">Plant</th>
                  {(data.weekDates || []).map((iso, i) => <th key={iso} className="font-bold pb-2 px-1 text-center">{DAY_SHORT[DAY_KEYS[i]]}</th>)}
                </tr>
              </thead>
              <tbody>
                {data.summary.map((s) => (
                  <tr key={s.plant} className="border-t border-slate-100">
                    <td className="py-2.5 pl-1 font-semibold text-slate-700 whitespace-nowrap">{s.plant}</td>
                    {(data.weekDates || []).map(iso => (
                      <td key={iso} className="text-center py-2.5">
                        <span className={`inline-block w-7 h-7 leading-7 rounded-lg text-[12.5px] font-bold ${(s.headcount[iso] || 0) === 0 ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-700'}`}>
                          {s.headcount[iso] !== undefined ? s.headcount[iso] : '-'}
                        </span>
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      </div>

      {assignRow && <AssignModal id={assignRow.id} lists={lists} onClose={() => setAssignRow(null)} onSaved={() => { setAssignRow(null); load(); }} />}
    </div>
  );
}

// ============================================================
// DASHBOARD — SUPERVISOR (plant)
// ============================================================
function PlantDashboard({ user, lists, weekStart, setWeekStart, goTo }) {
  const [data, setData] = useState(null);
  const [attn, setAttn] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    const [d, a] = await Promise.all([
      api('getDashboard', { weekStart }),
      api('listManagerAttention', { openOnly: false }),
    ]);
    if (d.ok) setData(d);
    if (a.ok) setAttn(a.rows);
    setLoading(false);
  }, [weekStart]);
  useEffect(() => { load(); }, [load]);

  if (loading || !data) return <Spinner />;
  const s = data.summary[0] || { weeklyUpdate: 'NO', attentionItems: 0, oldestPending: 0, hqPending: 0, headcount: {}, openLeaveGaps: 0, lowestHeadcount: 0 };

const ROW_LABELS = [
  { n: 1, title: 'Generation / Key Pending Issue', hint: 'Target generation & availability normal? Kalau tak, apa sebab utama?' },
  { n: 2, title: 'Equipment / Routine O&M atau CBM', hint: 'Ada isu equipment atau site? Nyatakan tindakan yang dah selesai.' },
  { n: 3, title: 'Routine O&M Result / Training atau Improvement', hint: 'Target routine O&M tercapai? Kalau tak, apa yang tinggal?' },
];
function WeeklyUpdateView({ user, lists, weekStart, setWeekStart }) {
  const isPlant = user.role === 'Supervisor';
  const isManager = user.role === 'Manager';
  const [plant, setPlant] = useState(isPlant ? user.plant : (lists.plants[0] || ''));
  const [rows, setRows] = useState([]);
  const [meta, setMeta] = useState({ reviewedBy: '', submittedAt: '' });
  const [loading, setLoading] = useState(true);
  const [editIdx, setEditIdx] = useState(null);
  const [msg, setMsg] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    const res = await api('getSupervisorUpdate', { weekStart, plant });
    if (res.ok) {
      const byType = {};
      res.rows.forEach(r => byType[r.RowType] = r);
      setRows([1, 2, 3].map(n => ({
        rowType: n,
        lastWeekOutcome: byType[n]?.LastWeekOutcome || '',
        thisWeekPriority: byType[n]?.ThisWeekPriority || '',
        remarks: byType[n]?.Remarks || '',
      })));
      setMeta({ reviewedBy: res.reviewedBy || '', submittedAt: res.submittedAt || '' });
    }
    setLoading(false);
  }, [weekStart, plant]);
  useEffect(() => { load(); }, [load]);

  const saveRow = async (idx, values) => {
    const next = rows.map((r, i) => i === idx ? { ...r, ...values } : r);
    setRows(next);
    setEditIdx(null);
    const res = await api('saveSupervisorUpdate', { weekStart, weekEnd: addDays(weekStart, 6), plant, rows: next });
    setMsg(res.ok ? 'Disimpan' : (res.error || 'Gagal simpan'));
    setTimeout(() => setMsg(''), 3500);
    load();
  };

  const review = async () => {
    const res = await api('reviewSupervisorUpdate', { weekStart, plant });
    if (!res.ok) return alert(res.error);
    setMsg('Ditanda telah disemak');
    setTimeout(() => setMsg(''), 3500);
    load();
  };

  const filled = rows.some(r => r.lastWeekOutcome || r.thisWeekPriority);

  return (
    <div className="max-w-5xl mx-auto space-y-4">
      <Card>
        <div className="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 className="font-extrabold text-slate-800">Update mingguan</h2>
            <p className="text-xs text-slate-500 mt-0.5">{plant} · {fmtDate(weekStart)} – {fmtDate(addDays(weekStart, 6))}</p>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            {!isPlant && (
              <select className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" value={plant} onChange={(e) => setPlant(e.target.value)}>
                {lists.plants.map(p => <option key={p}>{p}</option>)}
              </select>
            )}
            <WeekPicker value={weekStart} onChange={setWeekStart} />
          </div>
        </div>
        <div className="flex flex-wrap items-center gap-2 mt-3">
          {meta.reviewedBy
            ? <Pill className="bg-emerald-50 text-emerald-700">Telah disemak · {meta.reviewedBy}</Pill>
            : filled ? <Pill className="bg-amber-50 text-amber-700">Menunggu semakan manager</Pill>
              : <Pill className="bg-rose-50 text-rose-600">Belum dihantar</Pill>}
          {meta.submittedAt && <span className="text-[11.5px] text-slate-400">Dihantar {fmtDate(meta.submittedAt)}</span>}
          {msg && <span className="text-[12.5px] font-bold text-emerald-600">{msg}</span>}
        </div>
        {isPlant && <p className="text-[12px] text-slate-500 mt-3 bg-blue-50/60 rounded-xl px-3 py-2">Klik mana-mana baris untuk edit. Tulis result + sebab / tindakan, bukan setakat "Done".</p>}
        {isManager && <p className="text-[12px] text-slate-500 mt-3 bg-slate-50 rounded-xl px-3 py-2">Manager pantau sahaja — pengisian dibuat oleh supervisor plant.</p>}
      </Card>

      {loading ? <Spinner /> : (
        <Card pad="p-0">
          <div className="overflow-x-auto no-bar">
            <table className="w-full text-[13px] min-w-[760px]">
              <thead>
                <tr className="text-[10.5px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
                  <th className="text-left font-bold px-4 py-3 w-[190px]">Fokus</th>
                  <th className="text-left font-bold px-3 py-3">Outcome minggu lepas</th>
                  <th className="text-left font-bold px-3 py-3">Priority minggu ini</th>
                  <th className="text-left font-bold px-3 py-3 w-[140px]">Remarks</th>
                  {isPlant && <th className="px-3 py-3 w-[70px]"></th>}
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={r.rowType}
                    className={'border-b border-slate-50 align-top ' + (isPlant ? 'cursor-pointer hover:bg-blue-50/40' : '')}
                    onClick={() => isPlant && setEditIdx(i)}>
                    <td className="px-4 py-3">
                      <div className="flex items-start gap-2">
                        <span className="w-6 h-6 shrink-0 rounded-full bg-[#0b2a66] text-white text-[11px] font-extrabold flex items-center justify-center">{r.rowType}</span>
                        <span className="font-bold text-slate-800 leading-tight">{ROW_LABELS[i].title}</span>
                      </div>
                    </td>
                    <td className="px-3 py-3 text-slate-600">{r.lastWeekOutcome || <span className="text-slate-300">—</span>}</td>
                    <td className="px-3 py-3 text-slate-600">{r.thisWeekPriority || <span className="text-slate-300">—</span>}</td>
                    <td className="px-3 py-3 text-slate-500">{r.remarks || <span className="text-slate-300">—</span>}</td>
                    {isPlant && <td className="px-3 py-3"><span className="text-[12px] font-bold text-[#1d4ed8]">Edit</span></td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {isManager && (
            <div className="p-4 border-t border-slate-100 flex flex-wrap items-center gap-3">
              <Btn onClick={review} disabled={!filled || !!meta.reviewedBy}>
                {meta.reviewedBy ? 'Sudah disemak' : 'Tandakan telah disemak'}
              </Btn>
              <span className="text-[11.5px] text-slate-400">Manager tidak boleh mengubah isi update plant.</span>
            </div>
          )}
        </Card>
      )}

      {editIdx !== null && (
        <WeeklyRowModal row={rows[editIdx]} label={ROW_LABELS[editIdx]}
          onClose={() => setEditIdx(null)} onSave={(v) => saveRow(editIdx, v)} />
      )}
    </div>
  );
}

function WeeklyRowModal({ row, label, onClose, onSave }) {
  const [f, setF] = useState({ lastWeekOutcome: row.lastWeekOutcome, thisWeekPriority: row.thisWeekPriority, remarks: row.remarks });
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  return (
    <Modal title={label.title} subtitle={label.hint} onClose={onClose} wide>
      <Field label="Outcome minggu lepas"><textarea className={inputCls} rows={3} value={f.lastWeekOutcome} onChange={(e) => set('lastWeekOutcome', e.target.value)} autoFocus /></Field>
      <Field label="Priority minggu ini"><textarea className={inputCls} rows={3} value={f.thisWeekPriority} onChange={(e) => set('thisWeekPriority', e.target.value)} /></Field>
      <Field label="Remarks"><input className={inputCls} value={f.remarks} onChange={(e) => set('remarks', e.target.value)} /></Field>
      <Btn size="lg" className="w-full" disabled={saving} onClick={() => { setSaving(true); onSave(f); }}>{saving ? 'Menyimpan…' : 'Simpan'}</Btn>
    </Modal>
  );
}

  const isPlant = user.role === 'Supervisor';
  const [plant, setPlant] = useState(isPlant ? user.plant : (lists.plants[0] || ''));
  const [dateRaised, setDateRaised] = useState(toISO(new Date()));
  const [item, setItem] = useState('');
  const [priority, setPriority] = useState('Medium');
  const [saving, setSaving] = useState(false);

  const previewId = useMemo(() => {
    const slug = String(plant).replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    const d = new Date(dateRaised + 'T00:00:00');
    return `${slug}_${String(d.getDate()).padStart(2, '0')}${String(d.getMonth() + 1).padStart(2, '0')}${d.getFullYear()}`;
  }, [plant, dateRaised]);

  const save = async () => {
    setSaving(true);
    const res = await api('addManagerAttention', { plant, dateRaised, attentionItem: item, priority });
    setSaving(false);
    if (res.ok) onSaved(); else alert(res.error || 'Gagal simpan.');
  };

  return (
    <Modal title="Permohonan baru" subtitle="Hanya item yang perlukan keputusan manager / sokongan HQ" onClose={onClose}>
      {!isPlant && (
        <Field label="Plant">
          <select className={inputCls} value={plant} onChange={(e) => setPlant(e.target.value)}>{lists.plants.map(p => <option key={p}>{p}</option>)}</select>
        </Field>
      )}
      <Field label="Tarikh dimohon"><input type="date" className={inputCls} value={dateRaised} onChange={(e) => setDateRaised(e.target.value)} /></Field>
      <Field label="Perkara / Permohonan">
        <textarea className={inputCls} rows={3} value={item} onChange={(e) => setItem(e.target.value)} placeholder="cth: Inverter 3 trip berulang, perlu sokongan HQ untuk analisis" />
      </Field>
      <Field label="Priority">
        <select className={inputCls} value={priority} onChange={(e) => setPriority(e.target.value)}>{lists.priorities.map(p => <option key={p}>{p}</option>)}</select>
      </Field>
      <div className="bg-slate-50 rounded-xl px-3 py-2.5 mb-4 text-[12px] text-slate-500">
        ID akan dijana: <span className="font-mono font-bold text-slate-700">{previewId}</span>
      </div>
      <Btn size="lg" className="w-full" onClick={save} disabled={saving || !item}>{saving ? 'Menghantar…' : 'Hantar permohonan'}</Btn>
    </Modal>
  );
}

function AssignModal({ id, lists, onClose, onSaved }) {
  const [row, setRow] = useState(null);
  const [hq, setHq] = useState('');
  const [assignedDate, setAssignedDate] = useState(toISO(new Date()));
  const [expected, setExpected] = useState('');
  const [status, setStatus] = useState('Assigned to HQ');
  const [remarks, setRemarks] = useState('');
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    (async () => {
      const res = await api('listManagerAttention', { openOnly: false });
      if (res.ok) {
        const r = res.rows.find(x => String(x.ID) === String(id));
        if (r) {
          setRow(r);
          setHq(r.HQSupportAssigned || '');
          setAssignedDate(r.HQAssignedDate ? toISO(r.HQAssignedDate) : toISO(new Date()));
          setExpected(r.HQExpectedCompletion ? toISO(r.HQExpectedCompletion) : '');
          setStatus(r.Status || 'Assigned to HQ');
          setRemarks(r.ManagerRemarks || '');
        }
      }
    })();
  }, [id]);

  const save = async () => {
    setSaving(true);
    const res = await api('assignAttention', {
      id, hqAssigned: hq, hqAssignedDate: assignedDate, hqExpectedCompletion: expected, status, managerRemarks: remarks,
    });
    setSaving(false);
    if (res.ok) onSaved(); else alert(res.error || 'Gagal simpan.');
  };

  if (!row) return <Modal title="Memuatkan…" onClose={onClose}><Spinner small /></Modal>;

  return (
    <Modal title="Assign sokongan HQ" subtitle={`${row.ID} · ${row.Plant}`} onClose={onClose} wide>
      <div className="bg-slate-50 rounded-xl p-3 mb-4 text-[13px] text-slate-700">{row.AttentionItem}</div>
      <div className="grid sm:grid-cols-2 sm:gap-x-4">
        <Field label="HQ support assigned">
          <select className={inputCls} value={hq} onChange={(e) => setHq(e.target.value)}>
            <option value="">— Belum assign —</option>
            {lists.hqMembers.map(m => <option key={m}>{m}</option>)}
          </select>
        </Field>
        <Field label="Status">
          <select className={inputCls} value={status} onChange={(e) => setStatus(e.target.value)}>
            {lists.attentionStatuses.map(s => <option key={s}>{s}</option>)}
          </select>
        </Field>
        <Field label="Tarikh assign"><input type="date" className={inputCls} value={assignedDate} onChange={(e) => setAssignedDate(e.target.value)} /></Field>
        <Field label="Jangkaan siap (ETA)"><input type="date" className={inputCls} value={expected} onChange={(e) => setExpected(e.target.value)} /></Field>
      </div>
      <Field label="Manager remarks"><textarea className={inputCls} rows={2} value={remarks} onChange={(e) => setRemarks(e.target.value)} /></Field>
      {hq && (
        <p className="text-[12px] text-blue-700 bg-blue-50 rounded-xl px-3 py-2 mb-4">
          Tugasan HQ untuk <b>{hq}</b> akan dibuat / dikemaskini automatik dan dilink dengan permohonan ni.
        </p>
      )}
      <Btn size="lg" className="w-full" onClick={save} disabled={saving}>{saving ? 'Menyimpan…' : 'Simpan penugasan'}</Btn>
    </Modal>
  );
}

function EquipmentView({ user, lists }) {
  const isManager = user.role === 'Manager';
  const canRequest = user.role === 'Supervisor' || user.role === 'Manager';
  const [equip, setEquip] = useState([]);
  const [reqs, setReqs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('tools');
  const [editEquip, setEditEquip] = useState(null);
  const [showEquipAdd, setShowEquipAdd] = useState(false);
  const [requestFor, setRequestFor] = useState(null);
  const [editReq, setEditReq] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    const [e, r] = await Promise.all([api('listEquipment'), api('listEquipmentRequests', {})]);
    if (e.ok) setEquip(e.rows);
    if (r.ok) setReqs(r.rows);
    setLoading(false);
  }, []);
  useEffect(() => { load(); }, [load]);

  const eqStatusTone = (s) => {
    const v = String(s).toLowerCase();
    if (v === 'available') return 'bg-emerald-50 text-emerald-700';
    if (v === 'in use') return 'bg-blue-50 text-blue-700';
    if (v === 'ready for pickup') return 'bg-violet-50 text-violet-700';
    if (v === 'in transit') return 'bg-amber-50 text-amber-700';
    if (v === 'under repair' || v === 'unavailable') return 'bg-rose-50 text-rose-600';
    return 'bg-slate-100 text-slate-600';
  };

  const activeReqs = reqs.filter(r => ['Returned', 'Rejected'].indexOf(String(r.Status)) === -1);

  return (
    <div className="max-w-5xl mx-auto space-y-4">
      <Card>
        <div className="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 className="font-extrabold text-slate-800">Mobilisasi equipment</h2>
            <p className="text-xs text-slate-500 mt-0.5">Semua plant nampak keberadaan tool &amp; queue — tiada potong queue</p>
          </div>
          {isManager && tab === 'tools' && <Btn onClick={() => setShowEquipAdd(true)}>+ Equipment</Btn>}
        </div>
        <div className="flex gap-2 mt-4">
          {[['tools', 'Keberadaan tool'], ['requests', `Permohonan (${activeReqs.length})`]].map(([k, l]) => (
            <button key={k} onClick={() => setTab(k)}
              className={'px-3.5 py-1.5 rounded-full text-[12.5px] font-bold ' + (tab === k ? 'bg-[#0b2a66] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')}>{l}</button>
          ))}
        </div>
        {!isManager && <p className="text-[11.5px] text-slate-400 mt-3">Manager (superadmin) sahaja boleh ubah jadual, status dan susunan queue equipment.</p>}
      </Card>

      {loading ? <Spinner /> : tab === 'tools' ? (
        equip.length === 0 ? <Card><Empty text="Belum ada equipment didaftarkan." /></Card> : (
          <div className="grid sm:grid-cols-2 gap-3">
            {equip.map((r) => {
              const myQueuePos = r.Queue.findIndex(q => q.plant === user.plant);
              return (
                <Card key={r.ID} pad="p-4">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="font-extrabold text-slate-800 text-[14.5px] truncate">{r.EquipmentUnit}</div>
                      <div className="text-[12px] text-slate-500 mt-0.5">Sekarang di: <b className="text-slate-700">{r.CurrentPlant || '-'}</b></div>
                    </div>
                    <Pill className={eqStatusTone(r.Status)}>{r.Status}</Pill>
                  </div>

                  <div className="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-slate-100 text-[11.5px]">
                    <div><div className="text-slate-400">Jangka siap</div><div className="font-semibold text-slate-700">{fmtDate(r.PlannedFinish)}</div></div>
                    <div><div className="text-slate-400">Logistik HQ</div><div className="font-semibold text-slate-700">{r.HQLogisticsContact || '—'}</div></div>
                  </div>

                  <div className="mt-3 pt-3 border-t border-slate-100">
                    <div className="text-[10.5px] font-bold uppercase tracking-wide text-slate-400 mb-1.5">Queue</div>
                    {r.Queue.length === 0 ? <div className="text-[12px] text-slate-400">Tiada plant dalam queue</div> : (
                      <div className="space-y-1">
                        {r.Queue.map(q => (
                          <div key={q.id} className="flex items-center gap-2 text-[12px]">
                            <span className={'w-5 h-5 rounded-full text-[10px] font-extrabold flex items-center justify-center ' + (q.position === 1 ? 'bg-[#1d4ed8] text-white' : 'bg-slate-200 text-slate-600')}>{q.position}</span>
                            <span className={'font-semibold ' + (q.plant === user.plant ? 'text-[#1d4ed8]' : 'text-slate-700')}>{q.plant}</span>
                            <span className="text-slate-400">· mohon {fmtDateShort(q.requestDate)}</span>
                            <span className="text-slate-400">· {q.status}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    {myQueuePos >= 0 && <div className="text-[11.5px] text-[#1d4ed8] font-bold mt-2">Plant anda di kedudukan #{myQueuePos + 1} dalam queue</div>}
                  </div>

                  <div className="flex gap-2 mt-3">
                    {canRequest && <Btn size="sm" tone="outline" onClick={() => setRequestFor(r)}>Mohon mobilisasi</Btn>}
                    {isManager && <Btn size="sm" tone="ghost" onClick={() => setEditEquip(r)}>Ubah jadual</Btn>}
                  </div>
                </Card>
              );
            })}
          </div>
        )
      ) : (
        reqs.length === 0 ? <Card><Empty text="Tiada permohonan equipment." /></Card> : (
          <div className="space-y-3">
            {reqs.map((r) => (
              <Card key={r.ID} pad="p-4">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="font-mono text-[11px] font-bold text-slate-400">{r.ID}</span>
                      <Pill className={'bg-slate-100 ' + statusTone(r.Status)}>{r.Status}</Pill>
                      {r.RequestingPlant === user.plant && <Pill className="bg-blue-50 text-blue-700">Plant anda</Pill>}
                    </div>
                    <div className="font-bold text-slate-800 text-[14px] mt-1.5">{r.EquipmentUnit}</div>
                    <div className="text-[12px] text-slate-500 mt-0.5">
                      {r.RequestingPlant} · {r.RequestedBy} · mohon {fmtDate(r.RequestDate)}{r.NeededDate ? ' · perlu ' + fmtDate(r.NeededDate) : ''}
                    </div>
                    {r.Remarks && <div className="text-[12px] text-slate-500 mt-1">{r.Remarks}</div>}
                  </div>
                  {isManager && <Btn size="sm" onClick={() => setEditReq(r)}>Urus</Btn>}
                </div>
              </Card>
            ))}
          </div>
        )
      )}

      {showEquipAdd && <EquipmentModal lists={lists} onClose={() => setShowEquipAdd(false)} onSaved={() => { setShowEquipAdd(false); load(); }} />}
      {editEquip && <EquipmentModal row={editEquip} lists={lists} onClose={() => setEditEquip(null)} onSaved={() => { setEditEquip(null); load(); }} />}
      {requestFor && <EquipRequestModal equipment={requestFor} user={user} lists={lists} onClose={() => setRequestFor(null)} onSaved={() => { setRequestFor(null); setTab('requests'); load(); }} />}
      {editReq && <EquipRequestManageModal row={editReq} lists={lists} onClose={() => setEditReq(null)} onSaved={() => { setEditReq(null); load(); }} />}
    </div>
  );
}

function EquipmentModal({ row, lists, onClose, onSaved }) {

const DOW_HEAD = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
const MONTH_MS = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];

function shortName(n) {
  const s = String(n || '').trim();
  return s.length > 9 ? s.slice(0, 8) + '.' : s;
}
function cellStyle(cell) {
  if (!cell) return 'bg-white text-slate-300';
  if (cell.leave && !cell.relief) return 'bg-rose-100 text-rose-700 ring-2 ring-inset ring-rose-500';
  if (cell.leave && cell.relief) return 'bg-[#fce7f3] text-[#be185d] ring-2 ring-inset ring-[#db2777]';
  if (cell.coverFor) return (cell.working ? 'bg-rose-200 text-rose-900' : 'bg-[#e0e7ff] text-[#3730a3]') + ' ring-1 ring-inset ring-indigo-400';
  if (cell.code === '1') return 'bg-[#c6efce] text-[#14532d] font-bold';
  if (cell.code === '2') return 'bg-[#ffeb9c] text-[#78350f] font-bold';
  if (cell.code === 'Off') return 'bg-white text-slate-500';
  if (cell.code === 'Rest') return 'bg-slate-100 text-slate-500';
  return 'bg-white text-slate-400';
}
/** Baris atas = syif, baris bawah = nama pengganti / jenis cuti. */
function cellLines(cell) {
  if (!cell) return { top: '', bottom: '' };
  if (cell.leave && cell.relief) return { top: cell.code, bottom: shortName(cell.relief), strike: false };
  if (cell.leave) return { top: cell.code, bottom: cell.leave, strike: true };
  if (cell.coverFor) return { top: (cell.working ? cell.code : cell.coverCode) + '\u1d3f', bottom: 'ganti ' + shortName(cell.coverFor) };
  return { top: cell.code, bottom: '' };
}
function cellTitle(cell) {
  if (!cell) return '';
  if (cell.leave) return cell.leave + (cell.relief ? ' — diganti oleh ' + cell.relief : ' — TIADA pengganti');
  if (cell.coverFor) return 'Relief untuk ' + cell.coverFor + (cell.coverPlant ? ' (' + cell.coverPlant + ')' : '') + ' — syif ' + cell.coverCode + (cell.working ? ' (AMARAN: dia pun ada syif ' + cell.code + ' hari ni)' : '');
  return cell.code;
}

/** rows: [{ label, sub, cells:{iso:cell} }] — susun ikut minggu Ahad–Sabtu macam jadual asal. */
function MonthCalendar({ month, days, holidays, rows, onCellClick, canEdit, compact }) {
  const weeks = [];
  let cur = null;
  days.forEach((d) => {
    if (!cur || d.dow === 0) { cur = new Array(7).fill(null); weeks.push(cur); }
    cur[d.dow] = d;
  });

  return (
    <div className="space-y-2.5">
      {weeks.map((week, wi) => (
        <div key={wi} className="overflow-x-auto no-bar">
          <table className="w-full border-collapse text-center" style={{ minWidth: compact ? 340 : 520 }}>
            <thead>
              {wi === 0 && (
                <tr>
                  <th className="bg-white border-0"></th>
                  {DOW_HEAD.map((d, i) => (
                    <th key={i} className="border border-slate-300 bg-[#dbe5f1] px-1 py-0.5 text-[10px] font-extrabold text-slate-600">{d}</th>
                  ))}
                </tr>
              )}
              <tr>
                <th className={`bg-[#fff2cc] border border-slate-300 text-left px-2 py-1 text-[10.5px] font-extrabold text-slate-700 ${compact ? 'w-[86px]' : 'w-[130px]'}`}>Staff</th>
                {week.map((d, i) => (
                  <th key={i} className={`border border-slate-300 px-1 py-1 text-[10px] font-bold ${!d ? 'bg-slate-50 text-slate-300' : holidays[d.date] ? 'bg-rose-500 text-white' : 'bg-[#fff2cc] text-slate-700'}`}>
                    {d ? `${d.day}-${MONTH_MS[Number(month.split('-')[1]) - 1].slice(0, 3)}` : ''}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.label}>
                  <td className="bg-[#fff2cc] border border-slate-300 text-left px-2 py-1">
                    <div className="text-[11px] font-extrabold text-slate-800 leading-tight">{r.label}</div>
                    {r.sub && !compact && <div className="text-[9.5px] text-slate-500 leading-tight">{r.sub}</div>}
                  </td>
                  {week.map((d, i) => {
                    const cell = d ? r.cells[d.date] : null;
                    const clickable = canEdit && cell && cell.working && onCellClick;
                    return (
                      <td key={i} className="border border-slate-300 p-0">
                        {(() => {
                          const L = cellLines(cell);
                          return (
                            <button disabled={!clickable}
                              onClick={() => clickable && onCellClick(r, d.date, cell)}
                              title={cellTitle(cell)}
                              className={`w-full ${compact ? 'h-9' : 'h-10'} leading-tight flex flex-col items-center justify-center ${cellStyle(cell)} ${clickable ? 'hover:ring-2 hover:ring-inset hover:ring-[#1d4ed8] cursor-pointer' : 'cursor-default'}`}>
                              <span className={`text-[11px] font-bold ${L.strike ? 'line-through' : ''}`}>{L.top}</span>
                              {L.bottom && <span className="text-[8.5px] font-extrabold tracking-tight">{L.bottom}</span>}
                            </button>
                          );
                        })()}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ))}
    </div>
  );
}

/** Kad jadual untuk dashboard (supervisor = plant sendiri, HQ = grup A/B/C semua plant). */
function ScheduleCard({ user, goTo, mode, lists }) {
  const [month, setMonth] = useState(toISO(new Date()).slice(0, 7));
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    const res = await api('getSchedule', { month, plant: mode === 'plant' ? user.plant : 'ALL' });
    if (res.ok) setData(res);
    setLoading(false);
  }, [month, mode, user.plant]);
  useEffect(() => { load(); }, [load]);

  const shiftMonth = (n) => {
    const [y, m] = month.split('-').map(Number);
    setMonth(toISO(new Date(y, m - 1 + n, 1)).slice(0, 7));
  };

  const rows = useMemo(() => {
    if (!data) return [];
    return ['A', 'B', 'C'].map(g => {
      const inGroup = data.staff.filter(s => s.group === g);
      const mine = mode === 'plant' ? inGroup.find(s => s.plant === user.plant) : inGroup[0];
      return {
        label: mode === 'plant' ? g + ' · ' + (mine ? mine.name : '—') : 'Grup ' + g,
        sub: mode === 'plant' ? '' : inGroup.map(s => s.name).join(', '),
        cells: mine ? mine.cells : {},
        staff: mine,
      };
    });
  }, [data, mode, user.plant]);

  const [y, m] = month.split('-').map(Number);

  return (
    <Card>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
        <div>
          <h3 className="font-extrabold text-[15px] text-slate-800">{mode === 'plant' ? `Jadual ${user.plant}` : 'Jadual syif team'}</h3>
          <p className="text-[11.5px] text-slate-400">{mode === 'plant' ? 'Klik hari bertugas untuk rekod relief' : 'Grup A / B / C — semua plant ikut jadual sama'}</p>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => shiftMonth(-1)} className="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 text-sm">‹</button>
          <span className="text-[12.5px] font-bold text-slate-700 w-[112px] text-center">{MONTH_MS[m - 1]} {y}</span>
          <button onClick={() => shiftMonth(1)} className="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 text-sm">›</button>
          {goTo && <Btn size="sm" tone="ghost" onClick={() => goTo('Jadual')}>Buka penuh</Btn>}
        </div>
      </div>
      {loading || !data ? <Spinner small /> : (
        <React.Fragment>
          {mode === 'group' && lists && <div className="mb-3"><StaffMatrix lists={lists} compact /></div>}
          <MonthCalendar month={month} days={data.days} holidays={data.holidays} rows={rows} compact
            canEdit={mode === 'plant' && user.role === 'Supervisor'} onCellClick={() => goTo && goTo('Jadual')} />
          <div className="mt-3"><ScheduleLegend compact /></div>
        </React.Fragment>
      )}
    </Card>
  );
}


const DOW_LETTER = ['A', 'I', 'S', 'R', 'K', 'J', 'S']; // Ahad, Isnin, Selasa, Rabu, Khamis, Jumaat, Sabtu

function codeStyle(cell, isHoliday) {

            onCellClick={(row, date, cell) => row.staff && setSel({ staff: row.staff, date, cell })} />
          {plant !== 'ALL' && (
            <div className="mt-4 pt-3 border-t border-slate-100 flex flex-wrap gap-2 items-center">
              <span className="text-[10.5px] font-bold uppercase tracking-wide text-slate-400">Headcount harian</span>
              {data.days.map(d => (
                <span key={d.date} className="text-[11px] text-slate-500">
                  {d.day}:<b className={((data.headcount[d.date] || {})[plant] || 0) === 0 ? 'text-rose-600' : 'text-slate-700'}>{(data.headcount[d.date] || {})[plant] || 0}</b>
                </span>
              ))}
            </div>
          )}
          {canEdit && <div className="mt-3 text-[11.5px] text-slate-400">Klik hari bertugas untuk rekod cuti + pengganti. Pengganti yang dah diambil pada hari yang sama tak boleh dipilih lagi.</div>}
        </Card>
      ) : view === 'relief' ? (
        <ReliefListCard data={data} canEdit={canEdit} onReload={load} />
      ) : (
        <Card pad="p-0">
          <div className="overflow-x-auto">
            <table className="text-[12px] border-separate border-spacing-0">
              <thead>
                <tr>
                  <th className="sticky left-0 z-10 bg-white text-left font-bold text-[10.5px] uppercase tracking-wide text-slate-400 px-4 py-3 border-b border-slate-100 min-w-[150px]">Staff</th>
                  {data.days.map(d => (
                    <th key={d.date} className={`px-0 py-2 border-b border-slate-100 min-w-[30px] ${data.holidays[d.date] ? 'bg-rose-50' : (d.dow === 0 ? 'bg-slate-50' : '')}`}>
                      <div className="text-[9px] text-slate-400 font-bold">{DOW_LETTER[d.dow]}</div>
                      <div className={`text-[11px] font-bold ${data.holidays[d.date] ? 'text-rose-600' : 'text-slate-600'}`}>{d.day}</div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {data.staff.map(s => (
                  <tr key={s.plant + s.name}>
                    <td className="sticky left-0 z-10 bg-white px-4 py-2 border-b border-slate-50">
                      <div className="font-bold text-slate-800 text-[12.5px] leading-tight">{s.name}</div>
                      <div className="text-[10.5px] text-slate-400">{s.plant} · Grup {s.group}</div>
                    </td>

                      const clickable = canEdit && c.working;
                      return (
                        <td key={d.date} className={`p-0.5 border-b border-slate-50 text-center ${data.holidays[d.date] ? 'bg-rose-50/50' : ''}`}>
                          <button disabled={!clickable}
                            onClick={() => setSel({ staff: s, date: d.date, cell: c })}
                            title={c.leave ? `${c.leave}${c.relief ? ' — relief: ' + c.relief : ' — TIADA pengganti'}` : c.code}
                            className={`w-7 h-7 rounded text-[10.5px] font-bold flex items-center justify-center mx-auto ${codeStyle(c, data.holidays[d.date])} ${clickable ? 'hover:ring-2 hover:ring-[#1d4ed8] cursor-pointer' : 'cursor-default'}`}>
                            {c.leave ? (c.relief ? 'R' : '!') : (c.code === 'Off' ? '·' : c.code === 'Rest' ? '–' : c.code)}
                          </button>
                        </td>
                      );
                    })}
                  </tr>
                ))}
                {plant !== 'ALL' && (
                  <tr className="bg-slate-50/70">
                    <td className="sticky left-0 z-10 bg-slate-50 px-4 py-2 font-bold text-[11px] uppercase tracking-wide text-slate-500">Headcount</td>
                    {data.days.map(d => {
                      const n = (data.headcount[d.date] || {})[plant] || 0;
                      return <td key={d.date} className="text-center py-2">
                        <span className={`text-[11.5px] font-extrabold ${n === 0 ? 'text-rose-600' : 'text-slate-700'}`}>{n}</span>
                      </td>;
                    })}
                  </tr>
                )}
              </tbody>
            </table>
          </div>
          {canEdit && <div className="px-4 py-3 border-t border-slate-100 text-[11.5px] text-slate-400">Klik hari bertugas untuk rekod cuti + pengganti. Pengganti yang dah diambil pada hari yang sama tak boleh dipilih lagi.</div>}
        </Card>
      )}

      {sel && <ReliefModal sel={sel} lists={lists} user={user} onClose={() => setSel(null)} onSaved={() => { setSel(null); load(); }} />}
    </div>
  );
}

function ReliefListCard({ data, canEdit, onReload }) {
  const list = data.reliefList || [];
  const tally = data.reliefTally || {};
  const tallyRows = Object.keys(tally).map(k => ({ name: k, n: tally[k] })).sort((a, b) => b.n - a.n);
  const [busy, setBusy] = useState('');

  const remove = async (id) => {
    setBusy(id);
    const res = await api('deleteRelief', { id });
    setBusy('');
    if (!res.ok) return alert(res.error);
    onReload();
  };

  return (
    <div className="space-y-4">
      <Card pad="p-0">
        <div className="px-5 pt-5 pb-3">
          <h3 className="font-extrabold text-[15px] text-slate-800">Senarai relief bulan ini</h3>
          <p className="text-[11.5px] text-slate-400 mt-0.5">{list.length} rekod · {list.filter(r => !r.reliefStaff).length} masih tiada pengganti</p>
        </div>
        {list.length === 0 ? <div className="pb-6"><Empty text="Tiada rekod relief bulan ni." /></div> : (
          <div className="overflow-x-auto no-bar">
            <table className="w-full text-[12.5px] min-w-[720px]">
              <thead>
                <tr className="text-[10.5px] uppercase tracking-wide text-slate-400 border-y border-slate-100 bg-slate-50/60">
                  <th className="text-left font-bold px-4 py-2">Tarikh</th>
                  <th className="text-left font-bold px-3 py-2">Plant</th>
                  <th className="text-left font-bold px-3 py-2">Staf bercuti</th>
                  <th className="text-left font-bold px-3 py-2">Sebab</th>
                  <th className="text-left font-bold px-3 py-2">Pengganti</th>
                  <th className="text-left font-bold px-3 py-2">Nota</th>
                  {canEdit && <th className="px-3 py-2"></th>}
                </tr>
              </thead>
              <tbody>
                {list.map(r => (
                  <tr key={r.id} className="border-b border-slate-50">
                    <td className="px-4 py-2.5 font-semibold text-slate-700 whitespace-nowrap">{fmtDate(r.date)}</td>
                    <td className="px-3 py-2.5 text-slate-600">{r.plant}</td>
                    <td className="px-3 py-2.5 font-bold text-slate-800">{r.originalStaff}</td>
                    <td className="px-3 py-2.5"><Pill className="bg-slate-100 text-slate-600">{r.leaveType}</Pill></td>
                    <td className="px-3 py-2.5">
                      {r.reliefStaff
                        ? <span className="font-extrabold text-[#be185d]">{r.reliefStaff}</span>
                        : <span className="font-bold text-rose-600">TIADA PENGGANTI</span>}
                    </td>
                    <td className="px-3 py-2.5 text-slate-500">{r.remarks || '—'}</td>
                    {canEdit && (
                      <td className="px-3 py-2.5 text-right">
                        <button onClick={() => remove(r.id)} disabled={busy === r.id}
                          className="text-[11.5px] font-bold text-rose-500 hover:text-rose-700">{busy === r.id ? '…' : 'Padam'}</button>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Card>
        <SectionTitle>Kekerapan jadi pengganti (bulan ini)</SectionTitle>
        {tallyRows.length === 0 ? <Empty text="Belum ada." /> : (
          <div className="flex flex-wrap gap-2">
            {tallyRows.map(t => (
              <Pill key={t.name} className={t.n >= 3 ? 'bg-rose-50 text-rose-700' : 'bg-slate-100 text-slate-700'}>
                {t.name} · {t.n}x
              </Pill>
            ))}
          </div>
        )}
        <p className="text-[11.5px] text-slate-400 mt-3">Sistem auto-cadang staf yang paling kurang jadi pengganti supaya beban terbahagi rata.</p>
      </Card>
    </div>
  );
}

function ReliefModal({ sel, lists, user, onClose, onSaved }) {
  const { staff, date, cell } = sel;
  const [cands, setCands] = useState(null);
  const [suggested, setSuggested] = useState('');
  const [leaveType, setLeaveType] = useState(cell.leave || (lists.leaveTypes[0] || 'AL'));
  const [relief, setRelief] = useState(cell.relief || '');
  const [remarks, setRemarks] = useState('');
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    (async () => {
      const res = await api('getReliefCandidates', { date, plant: staff.plant, originalStaff: staff.name });
      if (res.ok) {
        setCands(res.candidates);
        setSuggested(res.suggested || '');
        // auto-pilih cadangan (paling kurang jadi pengganti bulan ni) kalau belum ada pilihan
        if (!cell.relief && res.suggested) setRelief(res.suggested);
      }
    })();
  }, [date, staff.name]);

  const save = async () => {
    setSaving(true);
    const res = await api('saveRelief', { date, plant: staff.plant, originalStaff: staff.name, leaveType, reliefStaff: relief, remarks });
    setSaving(false);
    if (res.ok) onSaved(); else alert(res.error || 'Gagal simpan.');
  };
  const remove = async () => {
    if (!cell.reliefId) return;
    setSaving(true);
    const res = await api('deleteRelief', { id: cell.reliefId });
    setSaving(false);
    if (res.ok) onSaved(); else alert(res.error || 'Gagal padam.');
  };

  const avail = cands ? cands.filter(c => c.available) : [];
  const busy = cands ? cands.filter(c => !c.available) : [];

  return (
    <Modal title="Rekod cuti & relief" subtitle={`${staff.name} · ${staff.plant} · ${fmtDate(date)} · syif ${cell.code}`} onClose={onClose} wide>
      <Field label="Jenis cuti">
        <select className={inputCls} value={leaveType} onChange={(e) => setLeaveType(e.target.value)}>
          {lists.leaveTypes.map(t => <option key={t}>{t}</option>)}
        </select>
      </Field>
      <Field label="Pengganti (relief)" hint="Hanya staf yang Off / Rest hari tu dan belum jadi relief orang lain">
        {!cands ? <Spinner small /> : (
          <select className={inputCls} value={relief} onChange={(e) => setRelief(e.target.value)}>
            <option value="">— Belum ada pengganti —</option>
            {avail.map(c => (
              <option key={c.name} value={c.name}>
                {c.name} · {c.plant}{c.samePlant ? ' (plant sama)' : ''} · {c.code} · {c.reliefCount || 0}x ganti bulan ni{c.name === suggested ? ' ⟵ dicadang' : ''}
              </option>
            ))}
          </select>
        )}
      </Field>
      {suggested && relief === suggested && (
        <p className="text-[11.5px] text-emerald-700 bg-emerald-50 rounded-xl px-3 py-2 -mt-1 mb-3">
          Auto-cadang: <b>{suggested}</b> — paling kurang jadi pengganti bulan ni, jadi beban terbahagi rata.
        </p>
      )}
      {busy.length > 0 && (
        <div className="bg-slate-50 rounded-xl px-3 py-2 mb-3 text-[11.5px] text-slate-500">
          Tidak boleh dipilih: {busy.slice(0, 6).map(c => `${c.name} (${c.reason})`).join(', ')}{busy.length > 6 ? '…' : ''}
        </div>
      )}
      <Field label="Nota"><input className={inputCls} value={remarks} onChange={(e) => setRemarks(e.target.value)} placeholder="cth: cuti kecemasan keluarga" /></Field>
      {!relief && <p className="text-[12px] text-rose-600 bg-rose-50 rounded-xl px-3 py-2 mb-3">Tanpa pengganti, headcount hari tu akan berkurang dan ditanda merah pada dashboard.</p>}
      <div className="flex gap-2">
        <Btn size="lg" className="flex-1" onClick={save} disabled={saving}>{saving ? 'Menyimpan…' : 'Simpan'}</Btn>
        {cell.reliefId && <Btn size="lg" tone="ghost" onClick={remove} disabled={saving}>Padam</Btn>}
      </div>
    </Modal>
  );
}

const LIST_COLUMNS = [
  { key: 'Plants', label: 'Plant', field: 'plants' },
  { key: 'EquipmentNames', label: 'Equipment', field: 'equipmentNames' },
  { key: 'Priority', label: 'Priority', field: 'priorities' },
  { key: 'AttentionStatus', label: 'Status permohonan', field: 'attentionStatuses' },
  { key: 'EquipmentStatus', label: 'Status equipment', field: 'equipmentStatuses' },
  { key: 'LeaveTypes', label: 'Jenis cuti', field: 'leaveTypes' },
];

function SettingsView({ lists, refreshLists }) {
  const [tab, setTab] = useState('users');
  const [users, setUsers] = useState([]);
  const [staff, setStaff] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editUser, setEditUser] = useState(null);
  const [editStaff, setEditStaff] = useState(null);
  const [activeList, setActiveList] = useState(LIST_COLUMNS[0]);
  const [newValue, setNewValue] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    const [u, s] = await Promise.all([api('listUsers'), api('listStaff')]);
    if (u.ok) setUsers(u.rows);
    if (s.ok) setStaff(s.rows);
    setLoading(false);
  }, []);
  useEffect(() => { load(); }, [load]);

  const addValue = async () => {
    if (!newValue.trim()) return;
    const res = await api('upsertListItem', { column: activeList.key, value: newValue.trim() });
    if (!res.ok) return alert(res.error);
    setNewValue('');
    refreshLists();
  };

  const roleTone = { Manager: 'bg-blue-50 text-blue-700', Supervisor: 'bg-emerald-50 text-emerald-700', HQ: 'bg-violet-50 text-violet-700' };
  const groupTone = { A: 'bg-blue-50 text-blue-700', B: 'bg-amber-50 text-amber-700', C: 'bg-violet-50 text-violet-700' };

  return (
    <div className="max-w-5xl mx-auto space-y-4">
      <Card>
        <div className="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 className="font-extrabold text-slate-800">Tetapan sistem</h2>
            <p className="text-xs text-slate-500 mt-0.5">Akaun pengguna, senarai staf jadual, dan senarai pilihan</p>
          </div>
          <div className="flex gap-2">
            {[['users', 'Akaun'], ['staff', 'Staf jadual'], ['lists', 'Senarai']].map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)}
                className={'px-3.5 py-1.5 rounded-full text-[12.5px] font-bold ' + (tab === k ? 'bg-[#0b2a66] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')}>{l}</button>
            ))}
          </div>
        </div>
      </Card>

      {tab === 'users' && (
        <Card>
          <SectionTitle action={<Btn size="sm" onClick={() => setEditUser({})}>+ Akaun</Btn>}>Akaun pengguna</SectionTitle>
          {loading ? <Spinner small /> : (
            <div className="divide-y divide-slate-100">
              {users.map(u => (
                <div key={u.ID} className="py-3 flex items-center gap-3 cursor-pointer hover:bg-slate-50/70 -mx-2 px-2 rounded-xl" onClick={() => setEditUser(u)}>
                  <div className="w-9 h-9 rounded-full bg-[#1d4ed8] text-white text-[12px] font-extrabold flex items-center justify-center shrink-0">{initials(u.Name)}</div>
                  <div className="min-w-0 flex-1">
                    <div className="font-bold text-[13.5px] text-slate-800 truncate">{u.Name}</div>
                    <div className="text-[11.5px] text-slate-400">{u.Plant}</div>
                  </div>
                  <Pill className={roleTone[u.Role] || 'bg-slate-100 text-slate-600'}>{u.Role}</Pill>
                  {String(u.Active).toUpperCase() === 'N' && <Pill className="bg-rose-50 text-rose-600">Tidak aktif</Pill>}
                </div>
              ))}
            </div>
          )}
          <p className="text-[11.5px] text-slate-400 mt-4 bg-slate-50 rounded-xl px-3 py-2">
            Satu akaun satu peranan — akaun Manager tak boleh jadi HQ. Dropdown "HQ support" dan "logistik HQ" ambil terus daripada akaun berperanan <b>HQ</b> di sini.
          </p>
        </Card>
      )}

      {tab === 'staff' && (
        <Card>
          <SectionTitle action={<Btn size="sm" onClick={() => setEditStaff({})}>+ Staf</Btn>}>Staf jadual (group A / B / C)</SectionTitle>
          {loading ? <Spinner small /> : (
            <div className="divide-y divide-slate-100">
              {staff.map(s => (
                <div key={s.ID} className="py-3 flex items-center gap-3 cursor-pointer hover:bg-slate-50/70 -mx-2 px-2 rounded-xl" onClick={() => setEditStaff(s)}>
                  <div className="min-w-0 flex-1">
                    <div className="font-bold text-[13.5px] text-slate-800 truncate">{s.Name}</div>
                    <div className="text-[11.5px] text-slate-400">{s.Plant}</div>
                  </div>
                  <Pill className={groupTone[s.Group] || 'bg-slate-100 text-slate-600'}>Grup {s.Group}</Pill>
                  {String(s.Active).toUpperCase() === 'N' && <Pill className="bg-rose-50 text-rose-600">Tidak aktif</Pill>}
                </div>
              ))}
            </div>
          )}
          <p className="text-[11.5px] text-slate-400 mt-4 bg-slate-50 rounded-xl px-3 py-2">
            Group menentukan jadual: cycle 12 hari (2,2,2,2,Off,Rest,1,1,1,1,Off,Rest). Nama di sini juga jadi pilihan dropdown pengganti relief.
          </p>
        </Card>
      )}

      {tab === 'lists' && (
        <Card>
          <SectionTitle>Senarai boleh edit</SectionTitle>
          <div className="flex flex-wrap gap-2 mb-4">
            {LIST_COLUMNS.map(c => (
              <button key={c.key} onClick={() => setActiveList(c)}
                className={'px-3 py-1.5 rounded-full text-[12px] font-bold ' + (activeList.key === c.key ? 'bg-[#0b2a66] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200')}>{c.label}</button>
            ))}
          </div>
          <div className="flex flex-wrap gap-2 mb-4">
            {(lists[activeList.field] || []).map(v => <Pill key={v} className="bg-slate-100 text-slate-700">{v}</Pill>)}
          </div>
          <div className="flex gap-2">
            <input className={inputCls} placeholder={'Tambah ' + activeList.label.toLowerCase() + ' baru'} value={newValue}

          </div>
          <p className="text-[11.5px] text-slate-400 mt-3">Disimpan dalam tab <b>Lists</b> kat Google Sheet — boleh edit terus di sana juga.</p>
        </Card>
      )}

      {editUser && <UserModal user={editUser} lists={lists} onClose={() => setEditUser(null)} onSaved={() => { setEditUser(null); load(); refreshLists(); }} />}
      {editStaff && <StaffModal staff={editStaff} lists={lists} onClose={() => setEditStaff(null)} onSaved={() => { setEditStaff(null); load(); refreshLists(); }} />}
    </div>
  );
}

function StaffModal({ staff, lists, onClose, onSaved }) {
  const [f, setF] = useState({
    Name: staff.Name || '', Plant: staff.Plant || (lists.plants[0] || ''), Group: staff.Group || 'A',
    Active: String(staff.Active || 'Y').toUpperCase() !== 'N',
  });
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const save = async () => {
    setSaving(true);
    const fields = { Name: f.Name, Plant: f.Plant, Group: f.Group, Active: f.Active ? 'Y' : 'N' };
    const res = await api('upsertStaff', staff.ID ? { id: staff.ID, fields } : { fields });
    setSaving(false);
    if (res.ok) onSaved(); else alert(res.error || 'Gagal simpan.');
  };
  return (
    <Modal title={staff.ID ? 'Kemaskini staf' : 'Tambah staf'} onClose={onClose}>
      <Field label="Nama"><input className={inputCls} value={f.Name} onChange={(e) => set('Name', e.target.value)} /></Field>
      <Field label="Plant"><select className={inputCls} value={f.Plant} onChange={(e) => set('Plant', e.target.value)}>{lists.plants.map(p => <option key={p}>{p}</option>)}</select></Field>
      <Field label="Group jadual" hint="A / B / C — menentukan syif harian sepanjang tahun">
        <select className={inputCls} value={f.Group} onChange={(e) => set('Group', e.target.value)}><option>A</option><option>B</option><option>C</option></select>
      </Field>
      <label className="flex items-center gap-2 text-sm mb-4 font-semibold text-slate-600">
        <input type="checkbox" checked={f.Active} onChange={(e) => set('Active', e.target.checked)} className="w-4 h-4" /> Aktif
      </label>
      <Btn size="lg" className="w-full" onClick={save} disabled={saving || !f.Name}>{saving ? 'Menyimpan…' : 'Simpan'}</Btn>
    </Modal>
  );
}

function UserModal({ user, lists, onClose, onSaved }) {
  const [f, setF] = useState({
    Name: user.Name || '', Plant: user.Plant || 'ALL', Role: user.Role || 'Supervisor',
    PIN: user.PIN || '', Active: String(user.Active || 'Y').toUpperCase() !== 'N',
  });
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));

  const save = async () => {
    setSaving(true);
    const fields = { Name: f.Name, Plant: f.Role === 'Supervisor' ? f.Plant : 'ALL', Role: f.Role, PIN: f.PIN, Active: f.Active ? 'Y' : 'N' };
    const res = await api('upsertUser', user.ID ? { id: user.ID, fields } : { fields });
    setSaving(false);
    if (res.ok) onSaved(); else alert(res.error || 'Gagal simpan.');
  };

  return (
    <Modal title={user.ID ? 'Kemaskini akaun' : 'Tambah akaun'} onClose={onClose}>
      <Field label="Nama" hint="Untuk akaun HQ, guna nama sebenar — nama ni yang muncul dalam dropdown assign">
        <input className={inputCls} value={f.Name} onChange={(e) => set('Name', e.target.value)} />
      </Field>
      <Field label="Peranan" hint="Manager = superadmin · Supervisor = plant sendiri · HQ = tugasan sendiri">
        <select className={inputCls} value={f.Role} onChange={(e) => set('Role', e.target.value)}>
          <option>Supervisor</option><option>Manager</option><option>HQ</option>
        </select>
      </Field>
      {f.Role === 'Supervisor' && (
        <Field label="Plant">
          <select className={inputCls} value={f.Plant === 'ALL' ? (lists.plants[0] || '') : f.Plant} onChange={(e) => set('Plant', e.target.value)}>
            {lists.plants.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </Field>
      )}
      <Field label="PIN"><input className={inputCls} value={f.PIN} onChange={(e) => set('PIN', e.target.value)} inputMode="numeric" /></Field>
      <label className="flex items-center gap-2 text-sm mb-4 font-semibold text-slate-600">
        <input type="checkbox" checked={f.Active} onChange={(e) => set('Active', e.target.checked)} className="w-4 h-4" /> Akaun aktif
      </label>
      <Btn size="lg" className="w-full" onClick={save} disabled={saving || !f.Name || !f.PIN}>{saving ? 'Menyimpan…' : 'Simpan'}</Btn>
    </Modal>
  );
}

  return (
    <div className="max-w-4xl mx-auto space-y-4">
      <div className="hero rounded-[22px] p-5 text-white">

            { t: 'HQ team update progress', d: 'HQ isi update terkini & tarikh siap' },
            { t: 'Plant & manager nampak status', d: 'Update HQ terus dipaparkan pada permohonan asal' },
            { t: 'Jadual & relief', d: 'Jadual setahun auto (grup A/B/C) — supervisor rekod pengganti bila ada cuti' },
